# PulseAudio config file for PipeWire version 1.4.10
#
# Based on PipeWire upstream pipewire-pulse.conf and tailored for WSLg.
#

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level   = -11
        }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-protocol-pulse
        args = {
        }
    }
    # Native RDP modules; pulse.cmd cannot resolve libpipewire-module-*.
    { name = libpipewire-module-wslg-rdp-sink
        args = {
            node.name        = RDPSink
            node.description = "WSLg RDP Sink"
            media.class      = Audio/Sink
            socket           = /mnt/wslg/PulseAudioRDPSink
            channels         = 2
            rate             = 44100
        }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-wslg-rdp-source
        args = {
            node.name        = RDPSource
            node.description = "WSLg RDP Source"
            media.class      = Audio/Source
            socket           = /mnt/wslg/PulseAudioRDPSource
            channels         = 1
            rate             = 44100
        }
        flags = [ ifexists nofail ]
    }
]

pulse.cmd = [
]

stream.properties = {
}

pulse.properties = {
    server.address = [
        "unix:/mnt/wslg/PulseServer"
    ]
    pulse.idle.timeout = 0
}

pulse.properties.rules = [
    {   matches = [ { cpu.vm.name = !null } ]
        actions = {
            update-props = {
                pulse.min.quantum = 1024/48000
            }
        }
    }
]

pulse.rules = [
]
